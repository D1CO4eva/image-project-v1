substitutions:
  _REGION: us-east1
  _SERVICE: image-project-v1
  _AR_REPOSITORY: image-project-v1
  _RUNTIME_SERVICE_ACCOUNT: image-project-v1-runtime

steps:
  - id: build-container
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - .
  - id: smoke-test-image
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --entrypoint=python
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - -m
      - scripts.smoke_check
  - id: push-container
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --cpu=8
      - --memory=16Gi
      - --concurrency=1
      - --timeout=600
      - --min=0
      - --max=2
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-secrets=DEEPSEEK_API_KEY=deepseek-api-key:latest
      - --allow-unauthenticated
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
